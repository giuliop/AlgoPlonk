name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic-version tag such as v0.3.2, got: $TAG_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Build release notes from changelog
        shell: bash
        run: |
          awk -v heading="## $TAG_NAME" '
            $0 == heading { in_release = 1; next }
            in_release && /^## / { exit }
            in_release { print }
            END { if (!in_release) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for $TAG_NAME in CHANGELOG.md" >&2
            exit 1
          fi

          previous_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"

          if [[ -n "$previous_tag" && "$previous_tag" != "$TAG_NAME" ]]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$TAG_NAME" >> release-notes.md
          fi

      - name: Publish release
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes-file release-notes.md
